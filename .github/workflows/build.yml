name: Build psemu Windows

on:
  push:
    branches: [main, branch-dreaming-sarah]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VULKAN_VERSION: 1.4.350.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up x64 Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools not found' }
          $toolDirs = @(
            "$env:ProgramFiles\LLVM\bin",
            "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin",
            "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
          )
          foreach ($dir in $toolDirs) {
            if (Test-Path -LiteralPath $dir) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $env:PATH = "$dir;$env:PATH"
            }
          }
          foreach ($tool in @('cmake', 'ninja', 'clang-cl', 'lld-link')) {
            Get-Command $tool -ErrorAction Stop | Select-Object Name, Source
          }

      - name: Test native atomics against invalid guest pointers
        shell: pwsh
        run: ./tools/scripts/test_native_atomics.ps1

      - name: Test semaphore NID dispatch and thread wakeup
        shell: pwsh
        run: ./tools/scripts/test_semaphore_dispatch.ps1

      - name: Test guest thread handle publication before entry
        shell: pwsh
        run: ./tools/scripts/test_guest_thread_start.ps1

      - name: Test guest reader writer exclusion and ownership
        shell: pwsh
        run: ./tools/scripts/test_guest_rwlock.ps1

      - name: Test positioned guest file reads and cursor preservation
        shell: pwsh
        run: ./tools/scripts/test_guest_positioned_read.ps1

      - name: Test AudioOut2 queue consumption and availability
        shell: pwsh
        run: ./tools/scripts/test_guest_audio_queue.ps1

      - name: Test AudioOut2 PCM conversion and host buffer ownership
        shell: pwsh
        run: ./tools/scripts/test_guest_audio_output.ps1

      - name: Test secure guest binary copies
        shell: pwsh
        run: ./tools/scripts/test_guest_safe_memory_copy.ps1

      - name: Test captured Astro bounded path copies
        shell: pwsh
        run: ./tools/scripts/test_guest_bounded_string.ps1

      - name: Test missing legacy save archive errors
        shell: pwsh
        run: ./tools/scripts/test_guest_save_transfer.ps1

      - name: Test captured Astro XML numeric parsing
        shell: pwsh
        run: ./tools/scripts/test_guest_numeric_parse.ps1

      - name: Test ten-argument ACB DMA ABI
        shell: pwsh
        run: ./tools/scripts/test_acb_dma_abi.ps1

      - name: Test byte-sized DMA transfers
        shell: pwsh
        run: ./tools/scripts/test_dma_bytes.ps1

      - name: Test encoded GDS append and consume offsets
        shell: pwsh
        run: ./tools/scripts/test_gds_append_decode.ps1
      - name: Test GS user data address snapshots
        shell: pwsh
        run: ./tools/scripts/test_gs_user_data_address.ps1

      - name: Test captured ES front-stage GS handoff
        shell: pwsh
        run: ./tools/scripts/test_es_front_decode.ps1

      - name: Upload fused Mesh resource replay tool
        uses: actions/upload-artifact@v4
        with:
          name: psemu-shader-resource-replay
          path: build/native-atomic-tests/es_front_decode_test.exe
          if-no-files-found: error
          retention-days: 14

      - name: Test NGG vertex wave ABI
        shell: pwsh
        run: ./tools/scripts/test_ngg_vertex_abi.ps1
      - name: Test overlapping vector buffer load address snapshot
        shell: pwsh
        run: ./tools/scripts/test_buffer_address_group.ps1

      - name: Test captured Astro BVH IR lowering
        shell: pwsh
        run: ./tools/scripts/test_bvh_ir.ps1

      - name: Test scalar 64-bit first-set-bit emission
        shell: pwsh
        run: ./tools/scripts/test_ff1_u64_emitter.ps1

      - name: Test unsigned 64-bit shader comparison emission
        shell: pwsh
        run: ./tools/scripts/test_u64_compare_emitter.ps1

      - name: Test R32Float depth storage readback
        shell: pwsh
        run: ./tools/scripts/test_depth_storage.ps1

      - name: Test canonical PS5 depth texture compatibility encodings
        shell: pwsh
        run: ./tools/scripts/test_depth_texture_compatibility.ps1

      - name: Test fatal depth snapshot with GPU logging disabled
        shell: pwsh
        run: ./tools/scripts/test_depth_fault_print.ps1

      - name: Test captured texture mip view backing and tail layout
        shell: pwsh
        run: ./tools/scripts/test_texture_mip_view.ps1

      - name: Test VideoOut buffer ownership refresh
        shell: pwsh
        run: ./tools/scripts/test_video_out_refresh.ps1

      - name: Test cyclic scalar provenance convergence
        shell: pwsh
        run: ./tools/scripts/test_scalar_provenance_loop.ps1

      - name: Test scalar 64-bit address shift provenance
        shell: pwsh
        run: ./tools/scripts/test_scalar_address_shift.ps1

      - name: Test DCC color metadata layout and clear decoding
        shell: cmd
        run: |
          clang-cl /nologo /std:c++20 /O2 /EHsc /MD /I gpu/src tests/dcc_metadata_test.cpp /Fe:build/native-atomic-tests/dcc_metadata_test.exe /Fo:build/native-atomic-tests/dcc_metadata_test.obj
          if errorlevel 1 exit /b 1
          build\\native-atomic-tests\\dcc_metadata_test.exe

      - name: Test GPU buffer and image edge page read ownership
        shell: cmd
        run: |
          clang-cl /nologo /std:c++20 /O2 /EHsc /MD /I gpu/src tests/buffer_image_read_range_test.cpp /Fe:build/native-atomic-tests/buffer_image_read_range_test.exe /Fo:build/native-atomic-tests/buffer_image_read_range_test.obj
          if errorlevel 1 exit /b 1
          build\\native-atomic-tests\\buffer_image_read_range_test.exe

      - name: Test exact sub-page image source coherence
        shell: pwsh
        run: ./tools/scripts/test_buffer_image_source.ps1

      - name: Test sparse GPU guest address table
        shell: pwsh
        run: ./tools/scripts/test_guest_address_table.ps1

      - name: Test direct native character table
        shell: pwsh
        run: ./tools/scripts/test_native_char_table.ps1

      - name: Test secure SysV resource name formatting
        shell: pwsh
        run: ./tools/scripts/test_secure_format.ps1

      - name: Test PS5 stat boundaries and shared kernel file IO
        shell: pwsh
        run: ./tools/scripts/test_kernel_file_io.ps1

      - name: Test Astro host allocation memory usage
        shell: pwsh
        run: ./tools/scripts/test_host_allocation_size.ps1

      - name: Test GPU memory mapping and fault resolution
        shell: pwsh
        run: ./tools/scripts/test_gpu_memory_bridge.ps1

      - name: Test native font handles and glyph rendering
        shell: pwsh
        run: ./tools/scripts/test_font.ps1

      - name: Test shared direct-memory backing and guest protections
        shell: cmd
        run: |
          clang-cl /nologo /std:c++20 /Od /EHsc /MD /I include tests/shared_direct_memory_test.cpp /Fe:build/native-atomic-tests/shared_direct_memory_test.exe /Fo:build/native-atomic-tests/shared_direct_memory_test.obj
          if errorlevel 1 exit /b 1
          build\native-atomic-tests\shared_direct_memory_test.exe

      - name: Test host allocation ownership
        shell: pwsh
        run: ./tools/scripts/test_allocation_ownership.ps1

      - name: Test guest call range and trampoline allocation
        shell: cmd
        run: |
          clang-cl /nologo /std:c++20 /EHsc /MD /I include tests/guest_detour_test.cpp /Fe:build/native-atomic-tests/guest_detour_test.exe /Fo:build/native-atomic-tests/guest_detour_test.obj
          if errorlevel 1 exit /b 1
          build\native-atomic-tests\guest_detour_test.exe

      - name: Test guest fallback stub memory boundaries
        shell: cmd
        run: |
          clang-cl /nologo /std:c++20 /EHsc /MD /I include tests/guest_stub_memory_test.cpp /Fe:build/native-atomic-tests/guest_stub_memory_test.exe /Fo:build/native-atomic-tests/guest_stub_memory_test.obj
          if errorlevel 1 exit /b 1
          build\native-atomic-tests\guest_stub_memory_test.exe

      - name: Install pinned Vulkan SDK on runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan_sdk.exe'
          $sdk = Join-Path $env:RUNNER_TEMP "VulkanSDK\$env:VULKAN_VERSION"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkan_sdk.exe"
          for ($sdkAttempt = 1; $sdkAttempt -le 4; $sdkAttempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 180
              break
            } catch {
              if ($sdkAttempt -eq 4) { throw }
              Write-Warning "Pinned SDK download attempt $sdkAttempt failed; retrying: $($_.Exception.Message)"
              Start-Sleep -Seconds 3
            }
          }
          $sdkArguments = @('--root', $sdk, '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'copy_only=1')
          $process = Start-Process -FilePath $installer -ArgumentList $sdkArguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installer failed: $($process.ExitCode)" }
          foreach ($file in @('Include\spirv-tools\libspirv.hpp', 'Lib\vulkan-1.lib', 'Lib\SPIRV-Tools.lib', 'Lib\SPIRV-Tools-opt.lib', 'Lib\SPIRV-Tools-link.lib')) {
            if (!(Test-Path -LiteralPath (Join-Path $sdk $file))) { throw "SDK dependency missing: $file" }
          }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test GPU guest address lookup SPIR-V
        shell: pwsh
        run: ./tools/scripts/test_guest_address_lookup.ps1

      - name: Test captured 1D storage lowering
        shell: pwsh
        run: ./tools/scripts/test_storage_1d.ps1

      - name: Test native Mesh output SPIR-V
        shell: pwsh
        run: ./tools/scripts/test_mesh_outputs.ps1

      - name: Test production native Mesh emitter
        shell: pwsh
        run: ./tools/scripts/test_native_mesh_emitter.ps1

      - name: Test scalar U64 decoder and Compute SPIR-V pipeline
        shell: pwsh
        run: ./tools/scripts/test_scalar_u64_compare.ps1

      - name: Upload production Mesh compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psemu-native-mesh-emitter-test
          path: |
            build/native-atomic-tests/native_mesh_emitter.spv
            build/native-atomic-tests/native_mesh_emitter_multiwave.spv
            build/native-atomic-tests/native_mesh_lane_backing.spv
            build/native-atomic-tests/native_mesh_upper_outputs.spv
            build/native-atomic-tests/native_mesh_upper_outputs_multiwave.spv
            build/native-atomic-tests/native_mesh_phased_dispatcher.spv
            build/native-atomic-tests/native_mesh_point_push.spv
            build/native-atomic-tests/native_mesh_buffer_reads.spv
            build/native-atomic-tests/native_mesh_sampled_reads.spv
            build/native-atomic-tests/native_mesh_sampled_reads_multiwave.spv
            build/native-atomic-tests/native_mesh_full_adapter.spv
            build/native-atomic-tests/native_mesh_emitter.spvasm
            build/native-atomic-tests/native_mesh_emitter_test.exe
            build/native-atomic-tests/native_mesh_output_probe.spv
            build/native-atomic-tests/spirv-val.exe
            build/native-atomic-tests/spirv-dis.exe
            build/native-atomic-tests/SPIRV-Tools*.dll
            build/native-atomic-tests/mesh_fragment.spv
            build/native-atomic-tests/mesh_gpu_smoke.exe
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare pinned native AvPlayer decoder libraries
        shell: pwsh
        run: |
          $taskTools=Join-Path $env:RUNNER_TEMP 'psemu-tools'
          ./tools/scripts/setup_ffmpeg.ps1 -ToolsDirectory $taskTools
          "PSEMU_FFMPEG_ROOT=$(Join-Path $taskTools 'ffmpeg-9ac4cfd195f1')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build complete emulator
        shell: cmd
        run: call cmbuild.bat

      - name: Package executable and runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist\tools\scripts -Force | Out-Null
          Copy-Item -LiteralPath loader.exe, gpu\3rdparty\winpthread\bin\libwinpthread-1.dll, run.bat, run_sarah.bat, LICENSE -Destination dist
          Copy-Item -LiteralPath tools\scripts\run_performance.bat -Destination dist\tools\scripts
          Copy-Item -LiteralPath gpu\3rdparty\winpthread\COPYING -Destination dist\WINPTHREAD-LICENSE.txt
          Copy-Item -LiteralPath LICENSES -Destination dist -Recurse
          if (!(Test-Path -LiteralPath dist\LICENSES\ffmpeg\SOURCE.txt)) { throw 'FFmpeg license/source notices missing' }
          $redist = Join-Path $env:VCToolsRedistDir 'x64'
          $crt = Get-ChildItem -LiteralPath $redist -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (!$crt) { throw 'Visual C++ runtime directory not found' }
          Get-ChildItem -LiteralPath $crt.FullName -Filter '*.dll' | Copy-Item -Destination dist
          @'
          Extract this package into your psemu folder after closing the emulator.
          Keep your existing game directory and save data.
          Run: run.bat PPSA02929-app0\eboot.bin
          Performance comparison: tools\scripts\run_performance.bat fast
          Detailed profiling: tools\scripts\run_performance.bat profile
          A Vulkan-compatible graphics driver is required. Game files are not included.
          '@ | Set-Content -LiteralPath dist\README.txt -Encoding utf8
          $manifest = Get-ChildItem -LiteralPath dist -File -Recurse | Get-FileHash -Algorithm SHA256
          $manifest | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetRelativePath((Resolve-Path dist).Path, $_.Path))" } | Set-Content dist\SHA256SUMS.txt

      - name: Test native AvPlayer guest ABI and PCM without game assets
        shell: pwsh
        run: |
          $taskScratch=Join-Path $env:RUNNER_TEMP 'psemu-avplayer-test'
          ./tools/scripts/test_avplayer.ps1 -LoaderPath (Resolve-Path dist/loader.exe).Path -ScratchDirectory $taskScratch

      - name: Test native SysV reader writer lock routing
        shell: pwsh
        run: |
          $p=[Diagnostics.Process]::new()
          $p.StartInfo.FileName=(Resolve-Path 'dist/loader.exe').Path
          $p.StartInfo.Arguments='--rwlock-self-test'
          $p.StartInfo.UseShellExecute=$false
          $p.StartInfo.CreateNoWindow=$true
          $p.StartInfo.RedirectStandardOutput=$true
          $p.StartInfo.RedirectStandardError=$true
          $null=$p.Start()
          if(!$p.WaitForExit(10000)){$p.Kill();throw 'RW-lock native self-test timed out'}
          $p.StandardOutput.ReadToEnd()|Write-Output
          $p.StandardError.ReadToEnd()|Write-Output
          if($p.ExitCode -ne 0){throw 'RW-lock native self-test failed'}
          $p.Dispose()

      - name: Test native Fiber stack switching without a game
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PSEMU_GPU_LOG='0'
          $taskExe=(Resolve-Path 'dist/loader.exe').Path
          $taskLog=Join-Path (Resolve-Path 'build/native-atomic-tests').Path 'fiber_runtime_log.txt'
          $taskErr=Join-Path (Resolve-Path 'build/native-atomic-tests').Path 'fiber_runtime_stderr.txt'
          $taskProcess=Start-Process -FilePath $taskExe -ArgumentList '--fiber-self-test' -WindowStyle Hidden -PassThru -RedirectStandardOutput $taskLog -RedirectStandardError $taskErr
          if(!$taskProcess.WaitForExit(10000)){
            if($taskProcess.Path -eq $taskExe){Stop-Process -Id $taskProcess.Id}
            throw 'Fiber self-test timed out'
          }
          Get-Content -LiteralPath $taskLog
          Get-Content -LiteralPath $taskErr
          if($taskProcess.ExitCode -ne 0){throw 'Fiber self-test failed'}

      - name: Test native event flag wait and wakeup without a game
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PSEMU_GPU_LOG='0'
          $taskExe=(Resolve-Path 'dist/loader.exe').Path
          $taskLog=Join-Path (Resolve-Path 'build/native-atomic-tests').Path 'event_flag_runtime_log.txt'
          $taskErr=Join-Path (Resolve-Path 'build/native-atomic-tests').Path 'event_flag_runtime_stderr.txt'
          $taskProcess=Start-Process -FilePath $taskExe -ArgumentList '--event-flag-self-test' -WindowStyle Hidden -PassThru -RedirectStandardOutput $taskLog -RedirectStandardError $taskErr
          if(!$taskProcess.WaitForExit(10000)){
            if($taskProcess.Path -eq $taskExe){Stop-Process -Id $taskProcess.Id}
            throw 'Event flag self-test timed out'
          }
          Get-Content -LiteralPath $taskLog
          Get-Content -LiteralPath $taskErr
          if($taskProcess.ExitCode -ne 0){throw 'Event flag self-test failed'}

      - name: Test direct SysV secure copy ABI and protected pointers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PSEMU_GPU_LOG='0'
          $taskExe=(Resolve-Path 'dist/loader.exe').Path
          $taskLog=Join-Path (Resolve-Path 'build/native-atomic-tests').Path 'secure_copy_runtime_log.txt'
          $taskErr=Join-Path (Resolve-Path 'build/native-atomic-tests').Path 'secure_copy_runtime_stderr.txt'
          $taskProcess=Start-Process -FilePath $taskExe -ArgumentList '--secure-copy-self-test' -WindowStyle Hidden -PassThru -RedirectStandardOutput $taskLog -RedirectStandardError $taskErr
          if(!$taskProcess.WaitForExit(10000)){
            if($taskProcess.Path -eq $taskExe){Stop-Process -Id $taskProcess.Id}
            throw 'Secure copy self-test timed out'
          }
          Get-Content -LiteralPath $taskLog
          Get-Content -LiteralPath $taskErr
          if($taskProcess.ExitCode -ne 0){throw 'Secure copy self-test failed'}

      - name: Upload downloadable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: psemu-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload host symbol map
        uses: actions/upload-artifact@v4
        with:
          name: psemu-windows-symbols
          path: build/loader.map
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone captured shader replay tool
        uses: actions/upload-artifact@v4
        with:
          name: psemu-shader-replay
          path: |
            build/native-atomic-tests/es_front_decode_test.exe
            dist/msvcp140*.dll
            dist/vcruntime140*.dll
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated Mesh output module
        uses: actions/upload-artifact@v4
        with:
          name: psemu-mesh-output-test
          path: |
            build/native-atomic-tests/native_mesh_emitter.spv
            build/native-atomic-tests/native_mesh_emitter_multiwave.spv
            build/native-atomic-tests/native_mesh_lane_backing.spv
            build/native-atomic-tests/native_mesh_upper_outputs.spv
            build/native-atomic-tests/native_mesh_upper_outputs_multiwave.spv
            build/native-atomic-tests/native_mesh_phased_dispatcher.spv
            build/native-atomic-tests/native_mesh_point_push.spv
            build/native-atomic-tests/native_mesh_buffer_reads.spv
            build/native-atomic-tests/native_mesh_sampled_reads.spv
            build/native-atomic-tests/native_mesh_sampled_reads_multiwave.spv
            build/native-atomic-tests/native_mesh_full_adapter.spv
            build/native-atomic-tests/mesh_outputs.spv
            build/native-atomic-tests/mesh_fragment.spv
            build/native-atomic-tests/mesh_gpu_smoke.exe
            dist/msvcp140*.dll
            dist/vcruntime140*.dll
          if-no-files-found: error
          retention-days: 14
